<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Notice - Digital Notice Board</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

<header>
  <div class="navbar">
    <div class="navbar-brand">
      <img src="../images/logocc.jpeg" alt="LOGOCC" class="nav-logo">
      <h2>Digital Notice Board</h2>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="notices.html">Notices</a>
      <a href="event.html">Events</a>
      <a href="annoc.html">Announcements</a>
      <a href="admindb.html">Dashboard</a>
      <span id="nav-username" class="nav-username"></span>
      <a href="#" id="nav-logout" id="logout-btn"> Logout</a>
    </nav>
  </div>
</header>

<div class="page-header">
  <h2>📝 Add New Notice</h2>
</div>

<div class="add-notice-container">
  <form id="add-notice-form">
    <label>Notice Title</label>
    <input type="text" id="notice-title" placeholder="Enter notice title" required>

    <label>Description</label>
    <textarea id="notice-desc" rows="4" placeholder="Enter detailed description..." required></textarea>

    <label>Category</label>
    <select id="notice-category">
      <option value="Exam"> Exam</option>
      <option value="Event"> Event</option>
      <option value="Holiday"> Holiday</option>
      <option value="General">General</option>
    </select>

    <label>Start Date</label>
    <input type="date" id="notice-start" required>

    <label>End / Expiry Date</label>
    <input type="date" id="notice-end" required>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Post Notice</button>
      <a href="managenotices.html"><button type="button" class="btn-cancel">Cancel</button></a>
    </div>
  </form>
</div>

<footer>
  <div class="footer-content">
    <div>
      <h3>About Us</h3>
      <p>Digital Notice Board System — Pragati Engineering College</p>
    </div>
    <div>
      <h3>Contact</h3>
      <p>Pragati Engineering College</p>
      <p> ADB road,Surampalem,Andhra Pradesh</p>
    </div>
    <div>
      <h3>Follow Us</h3>
      <div class="social">
        <a href=" https://www.instagram.com/pragatiengineering/ ">Instagram</a>
        <a href="https://www.facebook.com/PragatiEngineeeringCollege/">Facebook</a>
      </div>
    </div>
  </div>
  
</footer>
<div id="toast" class="toast"></div>

<script src="../js/auth.js"></script>
<script src="../js/notices.js"></script>
<script src="../js/announcements.js"></script>
<script src="../js/events.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const logoutBtn = document.getElementById("nav-logout");
    if (logoutBtn) logoutBtn.addEventListener("click", function(e) { e.preventDefault(); logout(); });
  });
</script>
</body>
</html>
