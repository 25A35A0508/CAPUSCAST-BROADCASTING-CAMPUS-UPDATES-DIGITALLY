<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Notices - Digital Notice Board</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

<header>
  <div class="navbar">
    <div class="navbar-brand">
      <img src="../images/logocc.jpeg" alt="LOGOCC" class="nav-logo">
      <h2>Digital Notice Board</h2>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="notices.html">Notices</a>
      <a href="event.html">Events</a>
      <a href="annoc.html">Announcements</a>
      <a href="admindb.html">Dashboard</a>
      <span id="nav-username" class="nav-username"></span>
      <a href="#" id="nav-logout" id="logout-btn"> Logout</a>
    </nav>
  </div>
</header>

<div class="page-header">
  <h2>⚙️ Manage Notices</h2>
  <a href="addnotice.html"><button class="btn-primary">➕ Add New Notice</button></a>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Posted By</th>
        <th>Posted On</th>
        <th>Expiry</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="notices-tbody">
      <tr><td colspan="6" style="text-align:center;padding:20px;">Loading...</td></tr>
    </tbody>
  </table>
</div>

<footer>
  <p class="footer-copy">© 2026 Digital Notice Board System — Pragati Engineering College</p>
</footer>

<div id="toast" class="toast"></div>

<!-- Edit Modal -->
<div id="edit-modal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h3> Edit Notice</h3>
    <form id="edit-notice-form">
      <input type="hidden" id="edit-id">
      <label>Title</label>
      <input type="text" id="edit-title" required>
      <label>Description</label>
      <textarea id="edit-desc" rows="3" required></textarea>
      <label>Category</label>
      <select id="edit-category">
        <option value="Exam">Exam</option>
        <option value="Event">Event</option>
        <option value="Holiday">Holiday</option>
        <option value="General">General</option>
      </select>
      <label>Start Date</label>
      <input type="date" id="edit-start" required>
      <label>End Date</label>
      <input type="date" id="edit-end" required>
      <div class="modal-actions">
        <button type="submit" class="btn-primary">Update</button>
        <button type="button" class="btn-cancel" onclick="closeModal('edit-modal')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/notices.js"></script>
<script src="../js/announcements.js"></script>
<script src="../js/events.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const logoutBtn = document.getElementById("nav-logout");
    if (logoutBtn) logoutBtn.addEventListener("click", function(e) { e.preventDefault(); logout(); });
  });
</script>
</body>
</html>
